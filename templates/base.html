<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResumeAI - AI-Powered Resume Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-color: #2563eb;
        --secondary-color: #64748b;
        --accent-color: #0ea5e9;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --light-bg: #f8fafc;
        --dark-text: #1e293b;
        --border-color: #e2e8f0;
        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-large: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      
      * {
        font-family: 'Inter', sans-serif;
      }
      
      body {
        background: var(--gradient-primary);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
        z-index: -1;
        animation: backgroundShift 20s ease-in-out infinite;
      }
      
      @keyframes backgroundShift {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      
      .navbar {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: var(--shadow-soft);
        transition: all 0.3s ease;
      }
      
      .navbar-brand {
        font-weight: 800;
        color: var(--primary-color) !important;
        font-size: 1.75rem;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      
      .navbar-brand:hover {
        transform: scale(1.05);
        color: var(--accent-color) !important;
      }
      
      .main-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: var(--shadow-large);
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin: 2rem auto;
        padding: 3rem;
        position: relative;
        overflow: hidden;
        animation: slideUp 0.8s ease-out;
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .main-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--gradient-primary);
        border-radius: 24px 24px 0 0;
      }
      
      .card {
        border: none;
        border-radius: 20px;
        box-shadow: var(--shadow-soft);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }
      
      .card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: var(--shadow-large);
      }
      
      .btn {
        border-radius: 16px;
        font-weight: 600;
        padding: 0.875rem 2rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        border: none;
      }
      
      .btn-primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: var(--shadow-soft);
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-large);
        color: white;
      }
      
      .form-control, .form-select {
        border-radius: 16px;
        border: 2px solid var(--border-color);
        padding: 1rem 1.25rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }
      
      .form-control:focus, .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        background: white;
        transform: translateY(-2px);
      }
      
      .template-card {
        border: 2px solid var(--border-color);
        border-radius: 20px;
        padding: 2rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
      }
      
      .template-card:hover, .template-card.selected {
        border-color: var(--primary-color);
        background: rgba(37, 99, 235, 0.05);
        transform: translateY(-8px) scale(1.05);
        box-shadow: var(--shadow-large);
      }
      
      .template-preview {
        width: 100%;
        height: 140px;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        background: linear-gradient(45deg, #f1f5f9, #e2e8f0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: var(--secondary-color);
        transition: all 0.3s ease;
      }
      
      .score-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 1.5rem;
        margin: 0 auto 1.5rem;
        position: relative;
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      
      .score-before {
        background: linear-gradient(135deg, var(--warning-color), #fbbf24);
        color: white;
        box-shadow: var(--shadow-soft);
      }
      
      .score-after {
        background: linear-gradient(135deg, var(--success-color), #34d399);
        color: white;
        box-shadow: var(--shadow-soft);
      }
      
      .keyword-tag {
        display: inline-block;
        background: rgba(37, 99, 235, 0.1);
        color: var(--primary-color);
        padding: 0.5rem 1rem;
        border-radius: 25px;
        font-size: 0.875rem;
        font-weight: 500;
        margin: 0.25rem;
        border: 1px solid rgba(37, 99, 235, 0.2);
        transition: all 0.3s ease;
      }
      
      .keyword-tag:hover {
        background: rgba(37, 99, 235, 0.2);
        transform: translateY(-2px);
      }
      
      .hero-section {
        text-align: center;
        padding: 4rem 0;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(14, 165, 233, 0.1));
        border-radius: 24px;
        margin-bottom: 3rem;
        position: relative;
        overflow: hidden;
      }
      
      .hero-title {
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--dark-text);
        margin-bottom: 1.5rem;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fadeInUp 1s ease-out;
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .hero-subtitle {
        font-size: 1.375rem;
        color: var(--secondary-color);
        margin-bottom: 2.5rem;
        font-weight: 400;
        animation: fadeInUp 1s ease-out 0.2s both;
      }
      
      @media (max-width: 768px) {
        .hero-title {
          font-size: 2.5rem;
        }
        
        .main-container {
          margin: 1rem;
          padding: 2rem;
        }
        
        .template-card {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
          <i class="fas fa-robot me-2"></i>ResumeAI
        </a>
        <div class="navbar-nav ms-auto">
          <span class="navbar-text">
            <i class="fas fa-magic me-1"></i>AI-Powered Resume Optimization
          </span>
        </div>
      </div>
    </nav>

    <div class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-warning alert-dismissible fade show" role="alert">
            {% for m in messages %}
              <div>{{ m }}</div>
            {% endfor %}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Template selection with smooth animations
      document.addEventListener('DOMContentLoaded', function() {
        const templateCards = document.querySelectorAll('.template-card');
        templateCards.forEach(card => {
          card.addEventListener('click', function() {
            templateCards.forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
            const input = this.querySelector('input[type="radio"]');
            if (input) input.checked = true;
          });
        });
      });
    </script>
  </body>
</html>
